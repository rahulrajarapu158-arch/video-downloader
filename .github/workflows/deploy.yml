name: Deploy VideoGrab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: worker
          command: deploy src/index.js

      - name: Deploy Pages (auto-create if needed)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy frontend --project-name=videograb --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: "40a4319a74d1e05592b2bf64c3f129f4"

      - name: Deploy Pages (fallback - create if missing)
        if: failure()
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy frontend --project-name=videograb --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: "40a4319a74d1e05592b2bf64c3f129f4"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
