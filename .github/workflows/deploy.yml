name: Deploy VideoGrab

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: worker
          command: deploy src/index.js

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy frontend --project-name=videograb --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: "8cf7456b44767c5e0b2d58e6072f2fae"
